name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 强制 JavaScript actions 使用 Node.js 24，提前规避 2026-06-02 之后
# GitHub 弃用 Node.js 20 的告警与运行风险（涉及 actions/checkout@v4、
# docker/setup-buildx-action@v3、docker/login-action@v3、docker/build-push-action@v6 等）。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set image metadata
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Pull BuildKit image with retry
        shell: bash
        run: |
          for i in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            sleep $((i * 10))
          done
          docker pull moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_BRANCH=${{ env.BUILD_BRANCH }}

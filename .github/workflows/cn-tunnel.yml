name: CN Tunnel Package
on:
  push:
    branches: ['**']
    paths:
      - 'scripts/cn-tunnel/**'
      - '.github/workflows/cn-tunnel.yml'
    tags: ['cn-tunnel-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and configuration generation
        run: |
          bash -n scripts/cn-tunnel/server-install.sh scripts/cn-tunnel/tests/integration-linux.sh
          python3 -m unittest discover -s scripts/cn-tunnel/tests -v
          python3 scripts/cn-tunnel/build.py cloud-installers
          bash -n cloud-installers/client-install.sh
      - name: Test real WireGuard HTTPS and streaming API
        run: sudo bash scripts/cn-tunnel/tests/integration-linux.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PowerShell templates
        shell: python
        run: |
          from pathlib import Path
          import re
          source = Path('scripts/cn-tunnel/server-install.sh').read_text(encoding='utf-8')
          blocks = re.findall(r"<<'POWERSHELL'\n(.*?)\nPOWERSHELL", source, re.S)
          assert len(blocks) == 2
          for i, block in enumerate(blocks):
              Path(f'client-{i}.ps1').write_text(block, encoding='utf-8-sig')
      - name: Parse Windows installers
        shell: powershell
        run: |
          Get-ChildItem client-*.ps1 | ForEach-Object {
            $Tokens = $null
            $ParseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors) | Out-Null
            if ($ParseErrors.Count -gt 0) { throw ($ParseErrors | Out-String) }
          }
      - name: Build and exercise Windows cloud installer
        shell: powershell
        run: |
          python scripts/cn-tunnel/build.py cloud-installers
          if ($LASTEXITCODE -ne 0) { throw 'Cloud installer build failed' }
          & ./scripts/cn-tunnel/tests/test-cloud-windows.ps1 -Installer (Resolve-Path cloud-installers/client-install.ps1)
  package:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build public installer archive (no client keys)
        run: |
          VERSION=$(cat scripts/cn-tunnel/VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "cn-tunnel-v$VERSION"
          fi
          python3 scripts/cn-tunnel/build.py cloud-installers
          cd scripts/cn-tunnel
          zip ../../cn-tunnel-v$VERSION.zip server-install.sh README.zh-CN.md VERSION CHANGELOG.zh-CN.md
          cd ../..
          cp cloud-installers/* .
          sha256sum cn-tunnel-v$VERSION.zip server-install.sh client-install.sh client-install.ps1 > cn-tunnel-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cn-tunnel-installer
          path: |
            cn-tunnel-v*.zip
            cn-tunnel-SHA256SUMS.txt
            server-install.sh
            client-install.sh
            client-install.ps1
      - name: Publish Chinese release notes and installer
        if: startsWith(github.ref, 'refs/tags/cn-tunnel-v')
        uses: softprops/action-gh-release@v2
        with:
          name: CN 隧道安装包 ${{ github.ref_name }}
          body_path: scripts/cn-tunnel/CHANGELOG.zh-CN.md
          make_latest: false
          files: |
            cn-tunnel-v*.zip
            cn-tunnel-SHA256SUMS.txt
            server-install.sh
            client-install.sh
            client-install.ps1
          fail_on_unmatched_files: true

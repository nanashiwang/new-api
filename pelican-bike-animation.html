<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #19344a;
      --coral: #ff775f;
      --cream: #fff8e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f5efe4;
      font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    .scene {
      width: min(100vw, 1080px);
      aspect-ratio: 16 / 10;
      position: relative;
      filter: drop-shadow(0 22px 28px rgb(35 45 55 / 16%));
    }

    svg { width: 100%; height: 100%; display: block; }

    .cloud { animation: cloud-drift 24s linear infinite; }
    .cloud.slow { animation-duration: 32s; animation-delay: -10s; }
    .grass { animation: grass-sway 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .grass:nth-child(2n) { animation-delay: -.8s; }
    .grass:nth-child(3n) { animation-delay: -1.6s; }

    .rider-group {
      animation: rider-bob 1.1s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    .pedal-crank { animation: pedal-spin 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .wheel-spin { animation: wheel-spin 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .leg-front { animation: leg-front 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 6px 5px; }
    .leg-back { animation: leg-back 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 6px 5px; }
    .wing-flap { animation: wing-flap 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 84% 25%; }
    .beak-sway { animation: beak-sway 2.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 50%; }
    .flag-wave { animation: flag-wave 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
    .fish-tail { animation: fish-tail 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }

    @keyframes cloud-drift { from { transform: translateX(-90px); } to { transform: translateX(980px); } }
    @keyframes grass-sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    @keyframes rider-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pedal-spin { to { transform: rotate(360deg); } }
    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes leg-front { 0%, 100% { transform: rotate(26deg); } 50% { transform: rotate(-32deg); } }
    @keyframes leg-back { 0%, 100% { transform: rotate(-32deg); } 50% { transform: rotate(26deg); } }
    @keyframes wing-flap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
    @keyframes beak-sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes flag-wave { from { transform: skewY(-3deg); } to { transform: skewY(5deg); } }
    @keyframes fish-tail { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="一只鹈鹕骑着自行车穿过海边小路的 2D SVG 动画">
    <svg viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">一只戴着小帽子的鹈鹕骑着蓝色自行车，轮子、云朵和翅膀都在轻柔地运动。</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8fd9ee" />
          <stop offset=".68" stop-color="#d6f1e8" />
          <stop offset="1" stop-color="#fce6bd" />
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55bfd0" />
          <stop offset="1" stop-color="#1598ad" />
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ddad78" />
          <stop offset=".5" stop-color="#f0c38b" />
          <stop offset="1" stop-color="#d99f6d" />
        </linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffdf6" />
          <stop offset="1" stop-color="#d9e8e7" />
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffad83" />
          <stop offset="1" stop-color="#ed6f61" />
        </linearGradient>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur" />
          <feOffset dy="8" result="offset" />
          <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.18  0 0 0 0 0.23  0 0 0 .2 0" />
          <feBlend in="SourceGraphic" />
        </filter>
      </defs>

      <!-- sky and distant landscape -->
      <rect width="960" height="600" fill="url(#sky)" />
      <circle cx="785" cy="108" r="45" fill="#fff4b0" opacity=".9" />
      <circle cx="785" cy="108" r="64" fill="none" stroke="#fff4b0" stroke-width="3" opacity=".28" stroke-dasharray="3 13" />

      <g class="cloud" opacity=".85" fill="#ffffff">
        <path d="M-30 154c22-23 53-20 70 4 9-31 57-32 69 4 27-4 51 10 55 35H-30z" />
      </g>
      <g class="cloud slow" opacity=".55" fill="#ffffff">
        <path d="M-220 75c24-28 67-20 76 12 20-27 66-15 69 20 28-3 49 14 53 36h-198z" />
      </g>

      <path d="M0 306c100-57 176 35 270-8 87-40 143 15 231-10 92-25 158 50 241 3 74-41 139-17 218 21v128H0z" fill="#8ed1ad" opacity=".9" />
      <path d="M0 342c110-45 191 13 274-6 95-22 171 32 248-1 75-32 144 24 218 0 90-29 150-3 220 19v108H0z" fill="#6db79b" opacity=".85" />
      <path d="M0 386c120-31 202 20 304 1 115-22 168 18 253 0 107-23 178 25 249 1 64-21 102-10 154 7v95H0z" fill="url(#sea)" />

      <!-- water glints -->
      <g fill="none" stroke="#b8f3ea" stroke-linecap="round" opacity=".75">
        <path d="M62 430h79M212 461h92M689 431h100M792 469h70" stroke-width="4" />
        <path d="M145 493h55M454 435h61M544 475h80" stroke-width="3" />
      </g>

      <!-- beach and road -->
      <path d="M0 466c166-24 305-10 467-4 175 7 319-28 493-5v143H0z" fill="#f6d89f" />
      <path d="M0 536c202-33 377-11 560-22 166-10 272-34 400-10v96H0z" fill="url(#road)" />
      <path d="M-20 574c228-30 419-4 602-20 143-13 256-36 399-13" fill="none" stroke="#fff0c5" stroke-width="5" stroke-dasharray="32 26" opacity=".7" />
      <g stroke="#4b9a75" stroke-width="5" stroke-linecap="round" class="grass">
        <path d="M54 515l-7-25M59 515l7-27M75 516l2-23" />
        <path d="M880 508l-7-26M886 508l8-30M901 510l2-24" />
        <path d="M184 493l-5-17M190 494l8-22M204 494l1-18" />
      </g>

      <!-- little sign -->
      <g transform="translate(111 322)">
        <path d="M23 116V37" stroke="#875b4a" stroke-width="8" stroke-linecap="round" />
        <path d="M24 38h108l-17 35H24z" fill="#ff8c6f" stroke="#fff8e9" stroke-width="5" />
        <path d="M45 58h55" stroke="#fff8e9" stroke-width="5" stroke-linecap="round" />
      </g>

      <!-- full rider and bike -->
      <g class="rider-group" filter="url(#soft-shadow)">
        <!-- bicycle wheels -->
        <g transform="translate(324 494)">
          <g class="wheel-spin">
          <circle r="68" fill="#fff8e9" stroke="#1d5970" stroke-width="9" />
          <circle r="8" fill="#ff7d63" />
          <g stroke="#5e9eb0" stroke-width="2.5">
            <path d="M0-8V-60M0 8v60M-8 0h-60M8 0h60M-6-6l-43-43M6-6l43-43M-6 6l-43 43M6 6l43 43" />
          </g>
          </g>
        </g>
        <g transform="translate(620 494)">
          <g class="wheel-spin">
          <circle r="68" fill="#fff8e9" stroke="#1d5970" stroke-width="9" />
          <circle r="8" fill="#ff7d63" />
          <g stroke="#5e9eb0" stroke-width="2.5">
            <path d="M0-8V-60M0 8v60M-8 0h-60M8 0h60M-6-6l-43-43M6-6l43-43M-6 6l-43 43M6 6l43 43" />
          </g>
          </g>
        </g>

        <!-- bike frame -->
        <g fill="none" stroke="#1d5970" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
          <path d="M324 494l94-141 77 141H324z" />
          <path d="M418 353l77 141" />
          <path d="M418 353h47" />
          <path d="M495 494l25-145" />
          <path d="M517 349l34-20" />
          <path d="M408 351h-24" />
          <path d="M352 456l-38-17M551 329l27-17" />
        </g>
        <path d="M395 344h42" stroke="#ff775f" stroke-width="13" stroke-linecap="round" />
        <circle cx="418" cy="494" r="19" fill="#ff775f" stroke="#1d5970" stroke-width="7" />
        <g transform="translate(418 494)">
          <g class="pedal-crank" fill="none" stroke="#1d5970" stroke-width="6" stroke-linecap="round">
          <path d="M0 0l32 18M0 0l-27-21" />
          <path d="M28 18h22M-30-22h-22" />
          </g>
        </g>

        <!-- front basket with fish -->
        <path d="M550 345h102l-12 61h-78z" fill="#f5c36d" stroke="#875b4a" stroke-width="6" />
        <path d="M557 354h90M554 371h89M551 388h86" fill="none" stroke="#d69549" stroke-width="4" />
        <g transform="translate(592 339)">
          <path d="M0 15c17-18 42-16 53 0-11 17-36 19-53 0z" fill="#6bb7c6" stroke="#24768b" stroke-width="3" />
          <path class="fish-tail" d="M52 15l19-14v28z" fill="#ff8b72" stroke="#a84c4e" stroke-width="3" />
          <circle cx="11" cy="12" r="3" fill="#19344a" />
        </g>

        <!-- pelican body -->
        <ellipse cx="450" cy="272" rx="95" ry="99" fill="url(#body)" stroke="#19344a" stroke-width="7" />
        <path class="wing-flap" d="M409 227c38-38 89-21 100 19 10 37-17 75-59 81-21 3-39-8-49-26 24-8 37-30 8-74z" fill="#bcd6d7" stroke="#19344a" stroke-width="7" />
        <path d="M422 237c17 6 32 18 41 34" fill="none" stroke="#8cafb4" stroke-width="6" stroke-linecap="round" />
        <path d="M431 268c14 6 23 14 30 26" fill="none" stroke="#8cafb4" stroke-width="5" stroke-linecap="round" />
        <path d="M451 351c-8 30-7 50-1 72M479 348c-3 27 0 46 9 70" fill="none" stroke="#ed735d" stroke-width="13" stroke-linecap="round" />
        <g transform="translate(451 351)">
          <g class="leg-front"><path d="M1 0l-13 75" fill="none" stroke="#ed735d" stroke-width="13" stroke-linecap="round" /><path d="M-14 74l21 6" fill="none" stroke="#19344a" stroke-width="8" stroke-linecap="round" /></g>
        </g>
        <g transform="translate(482 351)">
          <g class="leg-back"><path d="M1 0l-4 67" fill="none" stroke="#ed735d" stroke-width="13" stroke-linecap="round" /><path d="M-6 66l20 8" fill="none" stroke="#19344a" stroke-width="8" stroke-linecap="round" /></g>
        </g>

        <!-- neck and head -->
        <path d="M479 215c-6-39 3-68 35-80 32-12 57 9 57 40 0 38-29 59-66 64z" fill="url(#body)" stroke="#19344a" stroke-width="7" />
        <path d="M503 154c19 14 45 14 62 0" fill="none" stroke="#c6dddd" stroke-width="7" stroke-linecap="round" />
        <ellipse cx="535" cy="130" rx="59" ry="49" fill="url(#body)" stroke="#19344a" stroke-width="7" />
        <path d="M500 100c13-27 54-31 72-4-16-5-30-6-47 3z" fill="#ff775f" stroke="#19344a" stroke-width="6" />
        <circle cx="551" cy="124" r="8" fill="#19344a" />
        <circle cx="554" cy="121" r="3" fill="#fff" />
        <path class="beak-sway" d="M579 140c51-8 105 1 122 19-19 28-70 34-119 11z" fill="url(#pouch)" stroke="#19344a" stroke-width="7" />
        <path d="M584 157c38 5 75 4 106-1" fill="none" stroke="#d95453" stroke-width="5" stroke-linecap="round" />
        <path d="M589 174c13 19 38 24 54 7" fill="none" stroke="#ed735d" stroke-width="8" stroke-linecap="round" />
        <path d="M592 184c12 7 26 6 36-2" fill="none" stroke="#19344a" stroke-width="4" stroke-linecap="round" />

        <!-- handlebar and scarf -->
        <path d="M510 183c-26 13-33 30-34 50" fill="none" stroke="#ff775f" stroke-width="12" stroke-linecap="round" />
        <path d="M510 184c19 5 32 1 43-7" fill="none" stroke="#ff775f" stroke-width="8" stroke-linecap="round" />
        <path d="M492 186c-32 12-47 6-62-5 4 24 27 39 56 27" fill="#ff775f" stroke="#19344a" stroke-width="5" />

        <!-- rear pennant -->
        <path d="M349 352V269" stroke="#875b4a" stroke-width="5" stroke-linecap="round" />
        <path class="flag-wave" d="M350 271l55 18-55 17z" fill="#ff775f" stroke="#19344a" stroke-width="4" />
      </g>

      <text x="48" y="76" fill="#19344a" font-size="22" font-weight="700" letter-spacing="3">COASTAL CRUISE</text>
      <text x="48" y="105" fill="#19344a" font-size="15" opacity=".72">今天也要迎着风，慢慢骑。</text>
    </svg>
  </main>
</body>
</html>
